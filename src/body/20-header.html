<div class="unit">
  <div class="top">
    <div class="brand">
      <div class="logo">micro<b>tone</b></div>
      <div class="model">MICS009</div>
    </div>
    <div class="transport">
      <button class="t play" id="play" aria-label="Play/Stop">▶</button>
      <button class="t rec" id="rec" aria-label="Rec">●</button>
      <button class="t" id="undoBtn" aria-label="Undo" title="元に戻す">↩</button>
      <button class="t arm copy" id="holdCopy" title="押した後パッドで音色コピー">COPY</button>
      <button class="t arm mute" id="holdMute" title="押した後パッドでミュート">MUTE</button>
      <button class="t arm solo" id="holdSolo" title="押した後パッドでソロ">SOLO</button>
      <button class="t kebab" id="menuBtn" aria-label="Menu" aria-haspopup="dialog">⋮</button>
    </div>
    <!-- メニュー（SKIN / プロジェクト操作） -->
